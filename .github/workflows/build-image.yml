name: Build and publish Guacamole recovery image
run-name: Publish recovery7 from ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/build-recovery7-20261014
    paths:
      - build.sh
      - patches/**
      - tests/**
      - SHA256SUMS
      - RELEASE_METADATA.json

permissions:
  contents: read
  packages: write

concurrency:
  group: guacamole-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RELEASE_TAG: 1.6.0
  PACKAGE_TAG: 1.6.0-recovery7

jobs:
  build-and-publish:
    name: Build and publish recovery7
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare image metadata
        shell: bash
        run: |
          image_name="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/guacamole_patch"
          echo "PUBLISH_IMAGE=${image_name,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Guacamole recovery image
        shell: bash
        run: |
          MAVEN_ARGUMENTS="-T 1C -Dmaven.test.skip=true" \
          IMAGE_NAME="${PUBLISH_IMAGE}:${PACKAGE_TAG}" \
          bash ./build.sh

      - name: Publish image tags
        shell: bash
        run: |
          source_image="${PUBLISH_IMAGE}:${PACKAGE_TAG}"
          publish_tags=("${PACKAGE_TAG}" "sha-${SHORT_SHA}")

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            publish_tags+=("${RELEASE_TAG}" main)
          fi

          for tag in "${publish_tags[@]}"; do
            target_image="${PUBLISH_IMAGE}:${tag}"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
          done

          echo "PUBLISHED_TAGS=${publish_tags[*]}" >> "$GITHUB_ENV"

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "### Published Guacamole recovery image"
            echo
            for tag in ${PUBLISHED_TAGS}; do
              echo "- \`${PUBLISH_IMAGE}:${tag}\`"
            done
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
